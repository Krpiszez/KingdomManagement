<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Edit Governor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('governors')}"></nav>

<main class="app-page narrow">
    <div th:replace="~{fragments/layout :: pageHeader('Edit Governor', 'Update the governor profile and main power.', '/governors/' + form.id)}"></div>

    <section class="app-card app-card-body">
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle-fill"></i>
            <span th:text="${error}">Unable to update governor.</span>
        </div>

        <form th:action="@{/governors/edit/{id}(id=${form.id})}" th:object="${form}" method="post">
            <div class="mb-3">
                <label for="governorId" class="form-label fw-semibold">Governor ID</label>
                <input id="governorId" type="text" class="form-control" th:value="${form.id}" disabled>
            </div>

            <div class="mb-3">
                <label for="governorName" class="form-label fw-semibold">Governor Name</label>
                <input id="governorName" type="text" class="form-control" th:field="*{governorName}" maxlength="255" required>
            </div>

            <div class="mb-4">
                <label for="mainPower" class="form-label fw-semibold">Main Power</label>
                <input id="mainPower" type="number" class="form-control" th:field="*{mainPower}" min="0" step="1" placeholder="e.g. 50000000">
            </div>

            <div class="d-flex flex-wrap justify-content-between gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/governors/{id}(id=${form.id})}">
                    <i class="bi bi-arrow-left me-1"></i> Cancel
                </a>
                <button type="submit" class="btn app-btn-primary">
                    <i class="bi bi-check2 me-1"></i> Save Changes
                </button>
            </div>
        </form>
    </section>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
</body>
</html>
