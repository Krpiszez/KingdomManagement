<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Import AME Data')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('performance')}"></nav>

<main class="app-page narrow">
    <div th:replace="~{fragments/layout :: pageHeader('Import AME Data', 'Upload weekly Alliance Mobilization Event records.', '/ame/scores/calculate')}"></div>

    <section class="app-card app-card-body upload-card">
        <div th:if="${message}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill"></i><span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
        </div>

        <form th:action="@{/ame/import}" method="post" enctype="multipart/form-data">
            <label for="weekId" class="form-label fw-semibold">Select Week</label>
            <select id="weekId" name="weekNumber" required class="form-select mb-3">
                <option value="" disabled selected>Select a week</option>
                <option th:each="n : ${#numbers.sequence(1,10)}" th:value="${n}" th:text="'Week ' + ${n}">Week 1</option>
            </select>

            <label for="file" class="form-label fw-semibold">AME Data File</label>
            <div class="upload-drop" id="drop-area">
                <i class="bi bi-file-earmark-arrow-up upload-drop-icon"></i>
                <span class="fw-semibold">Click to browse or drag a file here</span>
                <span class="small text-muted mt-1">Upload the AME data export</span>
                <input class="upload-input" type="file" id="file" name="file" required>
            </div>
            <div class="file-name" id="file-name-display"></div>

            <button type="submit" class="btn app-btn-primary w-100 mt-4">
                <i class="bi bi-cloud-upload me-1"></i> Process File
            </button>
        </form>
    </section>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
<script>bindFileDrop('drop-area', 'file', 'file-name-display');</script>
</body>
</html>
