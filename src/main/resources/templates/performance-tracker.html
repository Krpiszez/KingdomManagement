<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Performance Tracker - Kingdom Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 40px;
        }
        .tracker-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card-custom {
            border-radius: 12px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<div class="container tracker-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📊 Performance Tracker</h2>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">← Back to Home</a>
    </div>

    <div class="card card-custom p-4 mb-4">
        <h4>Governor Metrics Overview</h4>
        <p class="text-muted">Analyze current kingdom efficiency, governor productivity, and realm stability parameters before computing scores.</p>

        <div class="my-3">
            <a th:href="@{/score-calculation}" class="btn btn-success btn-lg">
                Proceed to Score Calculation →
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
