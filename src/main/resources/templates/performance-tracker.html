<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Performance Tracker')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('performance')}"></nav>

<main class="app-page medium">
    <div th:replace="~{fragments/layout :: pageHeader('Performance Tracker', 'All kingdom performance tools are grouped here.', '/')}"></div>

    <div class="row g-4">
        <div class="col-lg-7">
            <a th:href="@{/credit-fort/tracker}" class="metric-card d-block text-decoration-none h-100">
                <div class="d-flex align-items-start justify-content-between gap-3">
                    <div>
                        <div class="metric-card-icon mb-3"><i class="bi bi-hammer"></i></div>
                        <h2 class="h4 fw-bold text-dark">Credit &amp; Fort Tracker</h2>
                        <p class="section-muted mb-4">
                            Track weekly credits, fort completion, requirements and governor pass/fail status.
                        </p>
                    </div>
                    <span class="badge text-bg-primary">Primary</span>
                </div>
                <span class="btn app-btn-primary">Open Credit &amp; Fort Tracker <i class="bi bi-arrow-right ms-1"></i></span>
            </a>
        </div>

        <div class="col-lg-5">
            <a th:href="@{/ame/scores/calculate}" class="metric-card d-block text-decoration-none h-100">
                <div class="metric-card-icon mb-3"><i class="bi bi-trophy"></i></div>
                <h2 class="h5 fw-bold text-dark">AME Performance</h2>
                <p class="section-muted mb-4">
                    Review AME scores, rankings and character performance by week.
                </p>
                <span class="btn app-btn-soft">Open AME Tracker <i class="bi bi-arrow-right ms-1"></i></span>
            </a>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
</body>
</html>
