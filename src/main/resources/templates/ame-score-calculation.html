<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('AME Performance')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('performance')}"></nav>

<main class="app-page">
    <div th:replace="~{fragments/layout :: pageHeader('AME Performance', 'Weekly Alliance Mobilization Event scores and rankings.', '/performance-tracker')}"></div>

    <section class="app-card">
        <div class="app-card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h2 class="section-title">Governor &amp; Character Summary</h2>
                <div class="d-flex flex-wrap gap-2 mt-2" th:if="${selectedWeek != null}">
                    <span class="badge bg-primary status-badge"><i class="bi bi-trophy-fill me-1"></i> Week Rank: <span th:text="${selectedWeek.ameRank != null ? selectedWeek.ameRank : 'N/A'}">1</span></span>
                    <span class="badge bg-success status-badge"><i class="bi bi-star-fill me-1"></i> Total Score: <span th:text="${selectedWeek.totalScore != null ? #numbers.formatInteger(selectedWeek.totalScore, 1, 'COMMA') : '0'}">10,000</span></span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/ame/import}" class="btn app-btn-primary btn-sm"><i class="bi bi-cloud-upload me-1"></i> Upload AME</a>
                <form th:action="@{/ame/scores/calculate}" method="get" class="d-flex align-items-center gap-2 m-0">
                    <label for="weekSelect" class="form-label mb-0 fw-semibold small">Week</label>
                    <select id="weekSelect" name="weekId" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="" th:selected="${selectedWeekId == null}">Latest Week</option>
                        <option th:each="week : ${weeks}" th:value="${week.id}" th:text="${week.name}" th:selected="${week.id == selectedWeekId}">Week 1</option>
                    </select>
                </form>
            </div>
        </div>

        <div class="app-card-body p-0">
            <div class="table-responsive">
                <table class="table app-table table-hover align-middle" id="scoresTable">
                    <thead>
                    <tr>
                        <th class="sortable" onclick="sortTable(0, 'number')">Character ID <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(1, 'string')">Character Name <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(2, 'string')">Governor <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(3, 'string')">Type <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(4, 'number')">Individual Score <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(5, 'number')">Total Score <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(6, 'string')">Status <i class="bi bi-arrow-down-up sort-icon"></i></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="score : ${calculatedScores}">
                        <td th:text="${score.character.id}">101</td>
                        <td th:text="${score.character.characterName}">Lancelot</td>
                        <td>
                            <a th:if="${score.character.governor != null}" th:href="@{/governors/{id}(id=${score.character.governor.id})}"
                               th:text="${score.character.governor.governorName}" class="fw-semibold text-decoration-none">Governor Alex</a>
                            <span th:unless="${score.character.governor != null}" class="text-muted">—</span>
                        </td>
                        <td><span th:class="${#strings.equalsIgnoreCase(score.character.type, 'MAIN') ? 'badge bg-primary status-badge' : 'badge bg-secondary status-badge'}" th:text="${score.character.type}">MAIN</span></td>
                        <td class="fw-bold" th:text="${#numbers.formatInteger(score.individualScore, 1, 'COMMA')}">1,200</td>
                        <td>
                            <span th:if="${#strings.equalsIgnoreCase(score.character.type, 'MAIN')}" class="fw-bold text-success"
                                  th:text="${#numbers.formatInteger(score.totalGovernorScore, 1, 'COMMA')}">3,500</span>
                            <span th:unless="${#strings.equalsIgnoreCase(score.character.type, 'MAIN')}" class="text-muted">—</span>
                        </td>
                        <td><span class="badge bg-success status-badge">Active</span></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(calculatedScores)}" id="emptyRow">
                        <td colspan="7" class="empty-state">
                            <i class="bi bi-inbox"></i>
                            No calculated scores available for this selection. Upload new records from the AME page.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
<script>
    function sortTable(columnIndex, type) {
        const table = document.getElementById("scoresTable");
        const tbody = table.querySelector("tbody");
        const rows = Array.from(tbody.querySelectorAll("tr:not(#emptyRow)"));
        const headers = table.querySelectorAll("th");
        const targetHeader = headers[columnIndex];
        if (!targetHeader || rows.length === 0) return;

        const currentIcon = targetHeader.querySelector(".sort-icon");
        const isAscending = !currentIcon.classList.contains("bi-caret-up-fill");
        headers.forEach(th => {
            const icon = th.querySelector(".sort-icon");
            if (icon) icon.className = "bi bi-arrow-down-up sort-icon";
        });
        currentIcon.className = isAscending ? "bi bi-caret-up-fill sort-icon text-dark" : "bi bi-caret-down-fill sort-icon text-dark";

        rows.sort((rowA, rowB) => {
            let valA = rowA.children[columnIndex].innerText.trim();
            let valB = rowB.children[columnIndex].innerText.trim();
            if (type === 'number') {
                valA = parseFloat(valA.replace(/,/g, '')) || 0;
                valB = parseFloat(valB.replace(/,/g, '')) || 0;
                return isAscending ? valA - valB : valB - valA;
            }
            return isAscending
                ? valA.localeCompare(valB, undefined, {numeric: true, sensitivity: 'base'})
                : valB.localeCompare(valA, undefined, {numeric: true, sensitivity: 'base'});
        });
        rows.forEach(row => tbody.appendChild(row));
    }
</script>
</body>
</html>
