<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<main class="app-page medium d-flex align-items-center" style="min-height: 100vh;">
    <section class="app-card p-4 p-md-5 mx-auto" style="width: 100%; max-width: 440px;">
        <div class="text-center mb-4">
            <div class="metric-card-icon mx-auto mb-3"><i class="bi bi-shield-lock-fill"></i></div>
            <h1 class="page-title">Kingdom Management</h1>
            <p class="page-subtitle mx-auto">Sign in to continue.</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            You have been signed out.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input id="username" name="username" type="text" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn app-btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
            </button>
        </form>
    </section>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
</body>
</html>
