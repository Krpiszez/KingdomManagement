<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bulk Import')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('governors')}"></nav>

<main class="app-page narrow">
    <div th:replace="~{fragments/layout :: pageHeader('Bulk Import', 'Upload governor and character data from a spreadsheet or CSV file.', '/governors')}"></div>

    <section class="app-card app-card-body upload-card">
        <div th:if="${message}" class="alert alert-success d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-check-circle-fill"></i><span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-circle-fill"></i><span th:text="${error}"></span>
        </div>

        <form th:action="@{/characters/import}" method="post" enctype="multipart/form-data">
            <label for="file" class="form-label fw-semibold">Select File to Import</label>
            <div class="upload-drop" id="drop-area">
                <i class="bi bi-file-earmark-arrow-up upload-drop-icon"></i>
                <span class="fw-semibold">Click to browse or drag a file here</span>
                <span class="small text-muted mt-1">Supported formats: .xlsx, .xls, .csv</span>
                <input class="upload-input" type="file" id="file" name="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.ms-excel" required>
            </div>
            <div class="file-name" id="file-name-display"></div>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-4">
                <button type="button" class="btn btn-outline-secondary" onclick="goBack('/governors')">
                    <i class="bi bi-arrow-left me-1"></i> Back
                </button>
                <button type="submit" class="btn app-btn-primary">
                    <i class="bi bi-cloud-upload me-1"></i> Upload &amp; Process
                </button>
            </div>
        </form>
    </section>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
<script>bindFileDrop('drop-area', 'file', 'file-name-display');</script>
</body>
</html>
