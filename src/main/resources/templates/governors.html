<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Governor Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 40px;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: white !important;
        }
        .main-container {
            max-width: 1100px;
            margin: auto;
        }
        .card-container {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f3f5;
        }
        h2 {
            color: #2c3e50;
            font-weight: 700;
            margin: 0;
            font-size: 1.8rem;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
        }
        .btn-custom {
            padding: 10px 20px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.12);
        }
        .btn-home {
            background-color: #6c757d;
            color: white;
        }
        .btn-home:hover {
            background-color: #5a6268;
            color: white;
        }
        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-upload:hover {
            color: white;
        }
        .table-responsive {
            margin-top: 20px;
        }
        .table {
            vertical-align: middle;
        }
        .table thead th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .badge-power {
            background-color: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
        }
        .character-pill {
            display: inline-block;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin: 2px;
        }
        .action-btns .btn {
            padding: 4px 10px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <span class="navbar-brand">👑 Kingdom Management</span>
    </div>
</nav>

<div class="main-container">
    <div class="card-container">
        <div class="header-section">
            <h2>Governor Management</h2>
            <div class="btn-group-custom">
                <a th:href="@{/}" class="btn btn-custom btn-home">
                    <i class="fas fa-home"></i> Home
                </a>
                <a th:href="@{/characters/import}" class="btn btn-custom btn-upload">
                    <i class="fas fa-cloud-upload-alt"></i> Bulk Upload (Excel)
                </a>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="row mb-3">
            <div class="col-md-6 ms-auto">
                <div class="input-group">
                    <span class="input-group-text bg-white"><i class="fas fa-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control" placeholder="Search by Governor Name or Characters..." onkeyup="filterTable()">
                </div>
            </div>
        </div>

        <!-- Table View -->
        <div class="table-responsive">
            <table class="table table-hover align-middle" id="governorsTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Governor Name</th>
                    <th>Main Power</th>
                    <th>Characters</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="governor : ${governors}">
                    <td class="fw-bold" th:text="${governor.id}">1</td>
                    <td>
                        <a th:href="@{/governors/{id}(id=${governor.id})}"
                           th:text="${governor.governorName}">Governor Name</a>
                    </td>                    <td>
                        <span class="badge-power" th:text="${governor.mainPower != null ? #numbers.formatInteger(governor.mainPower, 1, 'DEFAULT') : '0'}">
                            50,000,000
                        </span>
                    </td>
                    <td>
                        <div th:if="${not #lists.isEmpty(governor.characters)}">
                            <span th:each="char : ${governor.characters}" class="character-pill">
                                <i class="fas fa-user me-1 text-muted"></i>
                                <span th:text="${char.characterName}">Character Name</span>
                                <small class="text-muted" th:text="'(' + ${char.type} + ')'"></small>
                            </span>
                        </div>
                        <span th:if="${#lists.isEmpty(governor.characters)}" class="text-muted fst-italic">No characters assigned</span>
                    </td>
                    <td class="text-center action-btns">
                        <a th:href="@{/governors/edit/{id}(id=${governor.id})}" class="btn btn-outline-primary btn-sm me-1" title="Edit">
                            <i class="fas fa-edit"></i>
                        </a>
                        <a th:href="@{/governors/delete/{id}(id=${governor.id})}" class="btn btn-outline-danger btn-sm" title="Delete" onclick="return confirm('Are you sure you want to delete this governor?')">
                            <i class="fas fa-trash-alt"></i>
                        </a>
                    </td>
                </tr>
                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(governors)}">
                    <td colspan="5" class="text-center py-4 text-muted">
                        <i class="fas fa-users-slash fa-2x mb-2 d-block"></i>
                        No governors found. Add governors or upload an Excel file to get started.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function filterTable() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        const rows = document.querySelectorAll("#governorsTable tbody tr");

        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(input) ? "" : "none";
        });
    }
</script>
</body>
</html>
