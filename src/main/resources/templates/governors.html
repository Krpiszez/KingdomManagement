<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Governor Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 0;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 40px;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: white !important;
        }
        .main-container {
            max-width: 900px;
            margin: auto;
        }
        .card-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f3f5;
        }
        h2 {
            color: #2c3e50;
            font-weight: 700;
            margin: 0;
            font-size: 2rem;
        }
        .btn-group-custom {
            display: flex;
            gap: 10px;
        }
        .btn-custom {
            padding: 12px 25px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .btn-home {
            background-color: #6c757d;
            color: white;
        }
        .btn-home:hover {
            background-color: #5a6268;
            color: white;
            text-decoration: none;
        }
        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-upload:hover {
            color: white;
            text-decoration: none;
        }
        .content-text {
            color: #7f8c8d;
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 0;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <span class="navbar-brand">👑 Kingdom Management</span>
    </div>
</nav>

<div class="main-container">
    <div class="card-container">
        <div class="header-section">
            <h2>Governor Management</h2>
            <div class="btn-group-custom">
                <a th:href="@{/}" class="btn btn-custom btn-home">
                    <i class="fas fa-home"></i> Home
                </a>
                <a th:href="@{/characters/import}" class="btn btn-custom btn-upload">
                    <i class="fas fa-cloud-upload-alt"></i> Bulk Upload (Excel)
                </a>
            </div>
        </div>
        <p class="content-text">
            <i class="fas fa-info-circle" style="color: #667eea; margin-right: 8px;"></i>
            Select an action above to manage your governors or perform bulk creations via Excel files.
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
