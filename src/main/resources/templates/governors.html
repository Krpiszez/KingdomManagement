<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Governor Management')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('governors')}"></nav>

<main class="app-page">
    <div th:replace="~{fragments/layout :: pageHeader('Governor Management', 'Manage governors, characters and their kingdom roles.', '/')}"></div>

    <section class="app-card">
        <div class="app-card-header d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
                <h2 class="section-title">Governors</h2>
                <p class="section-muted mb-0 small">Select a governor to view detailed performance.</p>
            </div>
            <a sec:authorize="hasAnyRole('ADMIN', 'OFFICER')" th:href="@{/characters/import}" class="btn app-btn-primary">
                <i class="bi bi-cloud-upload me-1"></i> Bulk Upload
            </a>
        </div>

        <div class="app-card-body">
            <div class="row mb-3">
                <div class="col-md-6 ms-auto">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search governors or characters..." onkeyup="filterTable()">
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table app-table table-hover align-middle" id="governorsTable">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Governor Name</th>
                        <th>Main Power</th>
                        <th>Characters</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="governor : ${governors}">
                        <td class="fw-bold" th:text="${governor.id}">1</td>
                        <td>
                            <a th:href="@{/governors/{id}(id=${governor.id})}" th:text="${governor.governorName}" class="fw-semibold text-decoration-none">Governor Name</a>
                        </td>
                        <td>
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle status-badge"
                                  th:text="${governor.mainPower != null ? #numbers.formatInteger(governor.mainPower, 1, 'DEFAULT') : '0'}">50,000,000</span>
                        </td>
                        <td>
                            <div th:if="${not #lists.isEmpty(governor.characters)}">
                                <span th:each="char : ${governor.characters}" class="character-pill">
                                    <i class="bi bi-person text-muted"></i>
                                    <span th:text="${char.characterName}">Character Name</span>
                                    <small class="text-muted" th:text="'(' + ${char.type} + ')'">(MAIN)</small>
                                </span>
                            </div>
                            <span th:if="${#lists.isEmpty(governor.characters)}" class="text-muted fst-italic">No characters assigned</span>
                        </td>
                        <td class="text-center">
                            <span sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/governors/edit/{id}(id=${governor.id})}" class="btn btn-outline-primary btn-sm" title="Edit Governor">
                                    <i class="bi bi-pencil"></i>
                                </a>
                            </span>
                            <span sec:authorize="hasRole('ADMIN')">
                                <a th:href="@{/governors/delete/{id}(id=${governor.id})}" class="btn btn-outline-danger btn-sm" title="Delete"
                                   onclick="return confirm('Are you sure you want to delete this governor?')">
                                    <i class="bi bi-trash3"></i>
                                </a>
                            </span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(governors)}">
                        <td colspan="5" class="empty-state">
                            <i class="bi bi-people"></i>
                            No governors found. Add governors or upload an Excel file to get started.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
<script>
    function filterTable() {
        const input = document.getElementById("searchInput").value.toLowerCase();
        document.querySelectorAll("#governorsTable tbody tr").forEach(row => {
            row.style.display = row.innerText.toLowerCase().includes(input) ? "" : "none";
        });
    }
</script>
</body>
</html>
