<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome - Kingdom Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .welcome-card {
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 2.3rem;
        }
        .welcome-card p {
            color: #7f8c8d;
            font-size: 1.05rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-custom {
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
            margin-bottom: 12px;
            display: inline-block;
            text-decoration: none;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>

<div class="welcome-card">
    <h1>👑 Kingdom Management</h1>
    <p>Welcome! Manage your kingdom governors, keep track of performance metrics, and execute score calculations efficiently.</p>

    <div class="d-grid gap-2">
        <a th:href="@{/governors}" class="btn btn-primary btn-custom">
            Go to Governor Management →
        </a>
        <a th:href="@{/performance-tracker}" class="btn btn-outline-primary btn-custom">
            Go to Performance Tracker →
        </a>
        <a th:href="@{/credit-fort/tracker}" class="btn btn-outline-primary btn-custom">
            Go to Credit &amp; Fort Tracker →
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
