<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Credit & Fort Tracker')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('performance')}"></nav>

<main class="app-page">
    <div th:replace="~{fragments/layout :: pageHeader('Credit & Fort Tracker', 'Weekly governor performance for credits and fort completion.', '/performance-tracker')}"></div>

    <section class="app-card">
        <div class="app-card-header d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h2 class="section-title">Governor Summary</h2>
                <div th:if="${selectedWeek != null}" class="small text-muted mt-1">
                    <i class="bi bi-shield-fill me-1"></i>
                    Fort requirement: <strong th:text="${selectedWeek.fortRequirement}">70</strong>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/credit-fort/import}" class="btn app-btn-primary btn-sm">
                    <i class="bi bi-cloud-upload me-1"></i> Upload Week
                </a>
                <form th:action="@{/credit-fort/tracker}" method="get" class="d-flex align-items-center gap-2 m-0">
                    <label for="weekSelect" class="form-label mb-0 fw-semibold small">Week</label>
                    <select id="weekSelect" name="weekId" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="" th:selected="${selectedWeekId == null}">Latest Week</option>
                        <option th:each="week : ${weeks}" th:value="${week.id}" th:text="${week.name}" th:selected="${week.id == selectedWeekId}">Week 1</option>
                    </select>
                </form>
            </div>
        </div>

        <div class="app-card-body p-0">
            <div class="table-responsive">
                <table class="table app-table table-hover align-middle" id="summaryTable">
                    <thead>
                    <tr>
                        <th class="sortable" onclick="sortTable(0, 'string')">Governor <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(1, 'number')">Total Credits <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(2, 'number')">Required Credits <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(3, 'string')">Credit Status <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(4, 'number')">Forts (Main + Farm) <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(5, 'string')">Fort Status <i class="bi bi-arrow-down-up sort-icon"></i></th>
                        <th class="sortable" onclick="sortTable(6, 'number')">Main Forts <i class="bi bi-arrow-down-up sort-icon"></i></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="summary : ${summaries}">
                        <td>
                            <a th:if="${summary.governor != null}" th:href="@{/governors/{id}(id=${summary.governor.id})}"
                               th:text="${summary.governor.governorName}" class="fw-semibold text-decoration-none">Governor Alex</a>
                        </td>
                        <td th:text="${#numbers.formatInteger(summary.totalCredits, 1, 'COMMA')}">220,000</td>
                        <td th:text="${#numbers.formatInteger(summary.requiredCredits, 1, 'COMMA')}">220,000</td>
                        <td><span th:class="${summary.creditStatus == 'PASS' ? 'badge bg-success status-badge' : 'badge bg-danger status-badge'}" th:text="${summary.creditStatus}">PASS</span></td>
                        <td th:text="${summary.totalForts}">70</td>
                        <td><span th:class="${summary.fortStatus == 'PASS' ? 'badge bg-success status-badge' : 'badge bg-danger status-badge'}" th:text="${summary.fortStatus}">PASS</span></td>
                        <td class="fw-bold text-primary" th:text="${summary.mainForts}">30</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(summaries)}" id="emptyRow">
                        <td colspan="7" class="empty-state">
                            <i class="bi bi-inbox"></i>
                            No credit/fort data available for this selection. Upload new records from the import page.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
<script>
    function sortTable(columnIndex, type) {
        const table = document.getElementById("summaryTable");
        const tbody = table.querySelector("tbody");
        const rows = Array.from(tbody.querySelectorAll("tr:not(#emptyRow)"));
        const headers = table.querySelectorAll("th");
        const targetHeader = headers[columnIndex];
        if (!targetHeader || rows.length === 0) return;

        const currentIcon = targetHeader.querySelector(".sort-icon");
        const isAscending = !currentIcon.classList.contains("bi-caret-up-fill");
        headers.forEach(th => {
            const icon = th.querySelector(".sort-icon");
            if (icon) icon.className = "bi bi-arrow-down-up sort-icon";
        });
        currentIcon.className = isAscending ? "bi bi-caret-up-fill sort-icon text-dark" : "bi bi-caret-down-fill sort-icon text-dark";

        rows.sort((rowA, rowB) => {
            let valA = rowA.children[columnIndex].innerText.trim();
            let valB = rowB.children[columnIndex].innerText.trim();
            if (type === 'number') {
                valA = parseFloat(valA.replace(/,/g, '')) || 0;
                valB = parseFloat(valB.replace(/,/g, '')) || 0;
                return isAscending ? valA - valB : valB - valA;
            }
            return isAscending
                ? valA.localeCompare(valB, undefined, {numeric: true, sensitivity: 'base'})
                : valB.localeCompare(valA, undefined, {numeric: true, sensitivity: 'base'});
        });
        rows.forEach(row => tbody.appendChild(row));
    }
</script>
</body>
</html>
