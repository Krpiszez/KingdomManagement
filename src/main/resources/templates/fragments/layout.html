<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Kingdom Management'">Kingdom Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg app-navbar">
    <div class="container app-navbar-inner">
        <a class="navbar-brand app-brand d-inline-flex align-items-center gap-2" th:href="@{/}" aria-label="Kingdom Management home">
            <span class="app-brand-icon d-inline-flex align-items-center justify-content-center overflow-hidden rounded-pill" style="width: 42px; height: 36px; background-color: rgba(255, 255, 255, 0.1);">
                <img th:src="@{/images/NSFW-icon.png}" alt="Kingdom Management Logo" class="w-100 h-100 object-fit-cover">
            </span>
            <span>Kingdom Management</span>
        </a>

        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#appNavigation"
                aria-controls="appNavigation" aria-expanded="false" aria-label="Toggle navigation">
            <i class="bi bi-list fs-3 text-white"></i>
        </button>

        <div class="collapse navbar-collapse" id="appNavigation">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'home' ? ' active' : ''}" th:href="@{/}">
                        <i class="bi bi-house-door me-1"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'governors' ? ' active' : ''}" th:href="@{/governors}">
                        <i class="bi bi-people me-1"></i> Governor Management
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${activePage == 'performance' ? ' active' : ''}" th:href="@{/performance-tracker}">
                        <i class="bi bi-graph-up-arrow me-1"></i> Performance Tracker
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="pageHeader(title, subtitle, fallback)" class="page-header">
    <div>
        <h1 class="page-title" th:text="${title}">Page title</h1>
        <p th:if="${subtitle != null and !#strings.isEmpty(subtitle)}" class="page-subtitle" th:text="${subtitle}">Page subtitle</p>
    </div>
    <button type="button" class="btn btn-outline-secondary back-button" th:attr="data-fallback=${fallback}" onclick="goBack(this.dataset.fallback)">
        <i class="bi bi-arrow-left me-1"></i> Back
    </button>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:fragment="appScripts" th:src="@{/js/app.js}"></script>
</body>
</html>
