<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Score Calculation Modules')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('performance')}"></nav>

<main class="app-page medium">
    <div th:replace="~{fragments/layout :: pageHeader('Score Calculation Modules', 'Calculation tools available within performance tracking.', '/performance-tracker')}"></div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-5">
            <a th:href="@{/ame/scores/calculate}" class="metric-card d-block text-decoration-none h-100">
                <div class="metric-card-icon mb-3"><i class="bi bi-trophy"></i></div>
                <span class="badge text-bg-primary mb-3">Available</span>
                <h2 class="h5 fw-bold text-dark">AME Calculation</h2>
                <p class="section-muted">Calculate weekly Alliance Mobilization Event performance scores and rankings.</p>
                <span class="btn app-btn-primary">Open Calculator <i class="bi bi-arrow-right ms-1"></i></span>
            </a>
        </div>
        <div class="col-md-6 col-lg-5">
            <div class="metric-card h-100 opacity-75">
                <div class="metric-card-icon mb-3"><i class="bi bi-shield-shaded"></i></div>
                <span class="badge text-bg-secondary mb-3">Coming Soon</span>
                <h2 class="h5 fw-bold text-dark">Kingdom VS Kingdom</h2>
                <p class="section-muted">KvK event participation and kill points calculator module.</p>
                <button class="btn btn-outline-secondary" disabled>Unavailable</button>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
<script th:replace="~{fragments/layout :: appScripts}"></script>
</body>
</html>
