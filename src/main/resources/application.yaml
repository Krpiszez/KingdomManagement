spring:
  application:
    name: kingdom_management
  # DB credentials are read from environment variables (DB_URL, DB_USERNAME, DB_PASSWORD).
  # The values after the colon (e.g. root / 1234) are local-dev fallbacks only - override
  # them with real env vars for anything beyond your own machine.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rok_management_tools?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false

server:
  port: 8080
app:
  security:
    initial-users:
      # Set the corresponding environment variables before first startup.
      # Each account is created only if the username does not already exist.
      admin:
        username: ${APP_INITIAL_ADMIN_USERNAME:admin3161}
        password: ${APP_INITIAL_ADMIN_PASSWORD:1234}
      officer:
        username: ${APP_INITIAL_OFFICER_USERNAME:officer3161}
        password: ${APP_INITIAL_OFFICER_PASSWORD:1234}
      kingdom-member:
        username: ${APP_INITIAL_KINGDOM_MEMBER_USERNAME:member3161}
        password: ${APP_INITIAL_KINGDOM_MEMBER_PASSWORD:1234}
